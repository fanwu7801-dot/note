 230.39999999999998,-145.79999999999998 28.8,-145.79999999999998 " style="stroke:#243746;fill:#e4efff;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><polygon points="259.2,-100.8 460.8,-100.8 460.8,-145.79999999999998 259.2,-145.79999999999998 " style="stroke:#243746;fill:#f0f3f7;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><polygon points="489.59999999999997,-100.8 691.1999999999999,-100.8 691.1999999999999,-145.79999999999998 489.59999999999997,-145.79999999999998 " style="stroke:#243746;fill:#e4f5ec;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><polygon points="21.599999999999998,-15.480000000000015 698.4000000000001,-15.480000000000015 698.4000000000001,-41.40000000000001 21.599999999999998,-41.40000000000001 " style="stroke:#243746;fill:#fff1d8;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 32.4,-183.6 L 678.6,-183.6" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 685.6 -183.6 L 678.6 -180.9 L 678.6 -186.29999999999998 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 230.4,-123.47999999999999 L 250.20000000000002,-123.47999999999999" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 257.2 -123.47999999999999 L 250.2 -120.77999999999999 L 250.2 -126.17999999999999 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 460.8,-123.47999999999999 L 480.59999999999997,-123.47999999999999" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 487.59999999999997 -123.47999999999999 L 480.59999999999997 -120.77999999999999 L 480.59999999999997 -126.17999999999999 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><text x="360.0" y="-361.2" dominant-baseline="central" fill="#243746" font-size="21" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="21">03  一帧 LIN = Header + Response</tspan></text><text x="360.0" y="-331.17999999999995" dominant-baseline="central" fill="#526477" font-size="11.5" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="11.5">以无条件帧为例；颜色表示发送职责，字段宽度不代表真实持续时间。</tspan></text><text x="192.60000000000002" y="-294.8" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="192.60000000000002" dy="14.0">Header：主任务发送</tspan></text><text x="527.4" y="-294.8" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="527.4" dy="14.0">Response：该帧的发布者发送</tspan></text><text x="82.8" y="-249.3" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="82.8" dy="12.0">Break</tspan><tspan x="82.8" dy="12.0">≥ 13 bit</tspan></text><text x="167.4" y="-249.3" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="167.4" dy="12.0">界定符</tspan><tspan x="167.4" dy="12.0">≥ 1 bit</tspan></text><text x="237.6" y="-249.3" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="237.6" dy="12.0">Sync</tspan><tspan x="237.6" dy="12.0">0x55</tspan></text><text x="316.8" y="-255.3" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="316.8" dy="12.0">PID</tspan><tspan x="316.8" dy="12.0">6 bit ID</tspan><tspan x="316.8" dy="12.0">+ P0 / P1</tspan></text><text x="477.0" y="-249.3" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="477.0" dy="12.0">Data 0 ... Data N−1</tspan><tspan x="477.0" dy="12.0">N = 1～8 字节</tspan></text><text x="640.8" y="-249.3" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="640.8" dy="12.0">Checksum</tspan><tspan x="640.8" dy="12.0">1 字节</tspan></text><text x="360.0" y="-181.20000000000002" dominant-baseline="central" fill="#243746" font-size="12" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="12">时间方向 →；帧头与响应之间可有响应间隔，字节之间可有间隔</tspan></text><text x="129.6" y="-144.3" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="129.6" dy="14.0">主任务</tspan><tspan x="129.6" dy="14.0">按调度发送帧头</tspan></text><text x="360.0" y="-142.8" dominant-baseline="central" fill="#243746" font-size="13.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="13.0">所有相关节点</tspan><tspan x="360.0" dy="13.0">检查 PID，查本地帧配置</tspan></text><text x="590.4" y="-142.8" dominant-baseline="central" fill="#243746" font-size="13.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="590.4" dy="13.0">唯一发布者发送响应</tspan><tspan x="590.4" dy="13.0">订阅者接收并校验</tspan></text><text x="360.0" y="-88.6" dominant-baseline="central" fill="#243746" font-size="13" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="13">发布者可以是主节点，也可以是指定从节点；订阅者可以有多个。</tspan></text><text x="360.00000000000006" y="-40.44000000000001" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.00000000000006" dy="12.0">Header 不携带长度字段；LIN 2.x 的数据长度和发布 / 订阅关系来自 LDF 或静态配置。</tspan></text></svg>