<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:lang="en" height="344.42pt" width="686.0pt" viewBox="17.0 -355.3 686.0 344.42" style="background-color:white;"><polygon points="28.8,-237.6 190.79999999999998,-237.6 190.79999999999998,-280.8 28.8,-280.8 " style="stroke:#243746;fill:#e4efff;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><polygon points="277.2,-237.6 439.2,-237.6 439.2,-280.8 277.2,-280.8 " style="stroke:#243746;fill:#f0f3f7;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><polygon points="525.6,-237.6 687.6,-237.6 687.6,-280.8 525.6,-280.8 " style="stroke:#243746;fill:#f0f3f7;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><polygon points="28.8,-108.0 190.79999999999998,-108.0 190.79999999999998,-151.20000000000002 28.8,-151.20000000000002 " style="stroke:#243746;fill:#e4f5ec;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><polygon points="277.2,-108.0 439.2,-108.0 439.2,-151.20000000000002 277.2,-151.20000000000002 " style="stroke:#243746;fill:#e4f5ec;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><polygon points="525.6,-108.0 687.6,-108.0 687.6,-151.20000000000002 525.6,-151.20000000000002 " style="stroke:#243746;fill:#fff1d8;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><polygon points="21.599999999999998,-15.480000000000015 698.4000000000001,-15.480000000000015 698.4000000000001,-41.40000000000001 21.599999999999998,-41.40000000000001 " style="stroke:#243746;fill:#fff1d8;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 190.79999999999998,-259.2 L 268.2,-259.2" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 275.2 -259.2 L 268.2 -256.5 L 268.2 -261.9 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 439.2,-259.2 L 516.6,-259.2" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 523.6 -259.2 L 516.6 -256.5 L 516.6 -261.9 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 606.6,-237.6 L 606.6,-160.20000000000002" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 606.6 -153.20000000000002 L 603.9 -160.20000000000002 L 609.3000000000001 -160.20000000000002 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 525.6,-129.6 L 448.2,-129.6" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 441.2 -129.6 L 448.2 -132.29999999999998 L 448.2 -126.89999999999999 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 277.2,-129.6 L 199.79999999999998,-129.6" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 192.79999999999998 -129.6 L 199.79999999999998 -132.29999999999998 L 199.79999999999998 -126.89999999999999 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 109.8,-151.20000000000002 L 109.8,-228.6" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 109.8 -235.6 L 112.5 -228.6 L 107.1 -228.6 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><text x="360.0" y="-361.2" dominant-baseline="central" fill="#243746" font-size="21" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="21">07  休眠与唤醒：唤醒请求之后仍要恢复调度</tspan></text><text x="360.0" y="-331.17999999999995" dominant-baseline="central" fill="#526477" font-size="11.5" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="11.5">协议状态与芯片电源模式分开管理；EN / SLP / WAKE 的名称及极性以数据手册为准。</tspan></text><text x="109.8" y="-280.2" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="109.8" dy="14.0">正常通信</tspan><tspan x="109.8" dy="14.0">主节点运行调度表</tspan></text><text x="358.2" y="-280.2" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="358.2" dy="14.0">准备休眠</tspan><tspan x="358.2" dy="14.0">收尾事务、配置唤醒源</tspan></text><text x="606.6" y="-280.2" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="606.6" dy="14.0">低功耗等待</tspan><tspan x="606.6" dy="14.0">保持必要的唤醒检测</tspan></text><text x="234.0" y="-302.59999999999997" dominant-baseline="central" fill="#243746" font-size="11" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="234.0" dy="11">休眠请求</tspan></text><text x="482.40000000000003" y="-302.59999999999997" dominant-baseline="central" fill="#243746" font-size="11" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="482.40000000000003" dy="11">满足退出条件</tspan></text><text x="109.8" y="-149.1" dominant-baseline="central" fill="#243746" font-size="13.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="109.8" dy="13.0">恢复正常通信</tspan><tspan x="109.8" dy="13.0">主节点重新发送 Header</tspan></text><text x="358.2" y="-147.6" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="358.2" dy="12.0">恢复资源</tspan><tspan x="358.2" dy="12.0">时钟、UART、收发器就绪</tspan></text><text x="606.6" y="-150.6" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="606.6" dy="14.0">检测唤醒请求</tspan><tspan x="606.6" dy="14.0">总线脉冲 / 本地唤醒源</tspan></text><text x="360.0" y="-92.2" dominant-baseline="central" fill="#243746" font-size="13" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="13">从节点可以发起总线唤醒请求；这不等于从节点可以自行发出普通数据帧。</tspan></text><text x="360.00000000000006" y="-40.44000000000001" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.00000000000006" dy="12.0">标准休眠命令：ID 0x3C，Data = 00 FF FF FF FF FF FF FF，使用 Classic 校验。</tspan></text></svg>