9999999999998,-41.40000000000001 " style="stroke:#243746;fill:#fff1d8;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 183.6,-239.4 L 189.0,-239.4" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 196.0 -239.4 L 189.0 -236.70000000000002 L 189.0 -242.1 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 352.8,-239.4 L 358.2,-239.4" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 365.2 -239.4 L 358.2 -236.70000000000002 L 358.2 -242.1 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 522.0,-239.4 L 527.4,-239.4" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 534.4 -239.4 L 527.4 -236.70000000000002 L 527.4 -242.1 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><text x="360.0" y="-361.2" dominant-baseline="central" fill="#243746" font-size="21" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="21">08  从总线到业务：有效报文才能更新业务快照</tspan></text><text x="360.0" y="-331.17999999999995" dominant-baseline="central" fill="#526477" font-size="11.5" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="11.5">软件分层教学示意，不代表当前工程已经采用了某组具体 API。</tspan></text><text x="106.2" y="-305.59999999999997" dominant-baseline="central" fill="#243746" font-size="14" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="106.2" dy="14">LIN 电平</tspan></text><text x="106.19999999999999" y="-257.4" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="106.19999999999999" dy="12.0">收发器</tspan><tspan x="106.19999999999999" dy="12.0">总线 / 逻辑电平转换</tspan></text><text x="275.40000000000003" y="-305.59999999999997" dominant-baseline="central" fill="#243746" font-size="14" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="275.40000000000003" dy="14">UART / 驱动</tspan></text><text x="275.40000000000003" y="-257.4" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="275.40000000000003" dy="12.0">Break / Sync / PID</tspan><tspan x="275.40000000000003" dy="12.0">长度 / 校验 / 超时</tspan></text><text x="444.59999999999997" y="-305.59999999999997" dominant-baseline="central" fill="#243746" font-size="14" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="444.59999999999997" dy="14">信号服务</tspan></text><text x="444.59999999999997" y="-257.4" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="444.59999999999997" dy="12.0">按 LDF 解码</tspan><tspan x="444.59999999999997" dy="12.0">取值检查 / 新鲜度</tspan></text><text x="613.8000000000001" y="-305.59999999999997" dominant-baseline="central" fill="#243746" font-size="14" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="613.8000000000001" dy="14">RTE / APP</tspan></text><text x="613.8000000000001" y="-257.4" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="613.8000000000001" dy="12.0">读取一致快照</tspan><tspan x="613.8000000000001" dy="12.0">执行控制与降级</tspan></text><text x="189.00000000000003" y="-176.4" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="189.00000000000003" dy="12.0">cfg：波特率、ID、长度、校验、调度、超时</tspan><tspan x="189.00000000000003" dy="12.0">规则由配置或受控标定决定</tspan></text><text x="531.0000000000001" y="-176.4" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="531.0000000000001" dy="12.0">ctx：收发状态、索引、计时器、错误计数</tspan><tspan x="531.0000000000001" dy="12.0">内部过程只由所属模块维护</tspan></text><text x="189.00000000000003" y="-122.4" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="189.00000000000003" dy="12.0">data：信号值、采样时间、valid、quality</tspan><tspan x="189.00000000000003" dy="12.0">校验通过才更新有效信号值</tspan></text><text x="531.0000000000001" y="-122.4" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="531.0000000000001" dy="12.0">ops：初始化、周期处理、命令、获取快照</tspan><tspan x="531.0000000000001" dy="12.0">跨任务通过受控接口交互</tspan></text><text x="360.00000000000006" y="-40.44000000000001" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.00000000000006" dy="12.0">坏帧不刷新有效数据时间戳；持续收不到有效帧时，将快照标为过期并按需求降级。</tspan></text></svg>