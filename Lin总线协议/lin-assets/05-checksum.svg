<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:lang="en" height="344.42pt" width="686.0pt" viewBox="17.0 -355.3 686.0 344.42" style="background-color:white;"><polygon points="28.8,-246.60000000000002 223.20000000000002,-246.60000000000002 223.20000000000002,-289.8 28.8,-289.8 " style="stroke:#243746;fill:#f0f3f7;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><polygon points="262.8,-246.60000000000002 691.1999999999999,-246.60000000000002 691.1999999999999,-289.8 262.8,-289.8 " style="stroke:#243746;fill:#e4efff;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><polygon points="28.8,-180.0 176.39999999999998,-180.0 176.39999999999998,-223.20000000000002 28.8,-223.20000000000002 " style="stroke:#243746;fill:#e4efff;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><polygon points="208.79999999999998,-180.0 356.4,-180.0 356.4,-223.20000000000002 208.79999999999998,-223.20000000000002 " style="stroke:#243746;fill:#e4efff;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><polygon points="388.8,-180.0 536.4,-180.0 536.4,-223.20000000000002 388.8,-223.20000000000002 " style="stroke:#243746;fill:#e4f5ec;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><polygon points="568.8000000000001,-180.0 691.1999999999999,-180.0 691.1999999999999,-223.20000000000002 568.8000000000001,-223.20000000000002 " style="stroke:#243746;fill:#e4f5ec;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><polygon points="28.8,-118.8 691.1999999999999,-118.8 691.1999999999999,-156.6 28.8,-156.6 " style="stroke:#243746;fill:#fff1d8;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><polygon points="21.599999999999998,-15.480000000000015 698.4000000000001,-15.480000000000015 698.4000000000001,-41.40000000000001 21.599999999999998,-41.40000000000001 " style="stroke:#243746;fill:#fff1d8;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 176.4,-201.6 L 199.79999999999998,-201.6" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 206.79999999999998 -201.6 L 199.79999999999998 -198.9 L 199.79999999999998 -204.29999999999998 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 356.40000000000003,-201.6 L 379.8,-201.6" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 386.8 -201.6 L 379.8 -198.9 L 379.8 -204.29999999999998 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 536.4,-201.6 L 559.8000000000001,-201.6" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 566.8000000000001 -201.6 L 559.8000000000001 -198.9 L 559.8000000000001 -204.29999999999998 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><text x="360.0" y="-361.2" dominant-baseline="central" fill="#243746" font-size="21" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="21">05  校验和：回卷进位求和，再逐位取反</tspan></text><text x="360.0" y="-331.17999999999995" dominant-baseline="central" fill="#526477" font-size="11.5" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="11.5">教学示例：PID = 0xC1，Data = [0x10, 0x20]；增强校验包含 PID。</tspan></text><text x="126.0" y="-289.20000000000005" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="126.0" dy="14.0">Classic 传统校验</tspan><tspan x="126.0" dy="14.0">只计算 Data</tspan></text><text x="477.0" y="-289.20000000000005" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="477.0" dy="14.0">Enhanced 增强校验</tspan><tspan x="477.0" dy="14.0">计算 PID + Data；不是 6 bit 原始 ID + Data</tspan></text><text x="102.6" y="-222.6" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="102.6" dy="14.0">0xC1 + 0x10</tspan><tspan x="102.6" dy="14.0">= 0xD1</tspan></text><text x="282.59999999999997" y="-222.6" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="282.59999999999997" dy="14.0">0xD1 + 0x20</tspan><tspan x="282.59999999999997" dy="14.0">= 0xF1</tspan></text><text x="462.6" y="-222.6" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="462.6" dy="14.0">逐位取反</tspan><tspan x="462.6" dy="14.0">保留 8 bit</tspan></text><text x="630.0" y="-222.6" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="630.0" dy="14.0">Checksum</tspan><tspan x="630.0" dy="14.0">= 0x0E</tspan></text><text x="360.0" y="-150.7" dominant-baseline="central" fill="#243746" font-size="13.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="13.0">进位示例：0xF0 + 0x30 = 0x120 → 0x20 + 1 = 0x21 → Checksum = 0xDE</tspan></text><text x="360.0" y="-113.8" dominant-baseline="central" fill="#243746" font-size="13" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="13">接收时，把校验范围内的字节与 Checksum 做同样的回卷求和，结果应为 0xFF</tspan></text><text x="360.0" y="-89.4" dominant-baseline="central" fill="#243746" font-size="12" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="12">本例 Classic：对 0x10 + 0x20 取反得 0xCF，与 Enhanced 的 0x0E 不同</tspan></text><text x="360.00000000000006" y="-40.44000000000001" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.00000000000006" dy="12.0">ID 0x3C / 0x3D 的诊断帧使用 Classic；校验模型须与版本及帧配置一致。</tspan></text></svg>