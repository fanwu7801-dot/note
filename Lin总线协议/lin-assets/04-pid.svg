ygon points="21.599999999999998,-15.480000000000015 698.4000000000001,-15.480000000000015 698.4000000000001,-41.40000000000001 21.599999999999998,-41.40000000000001 " style="stroke:#243746;fill:#fff1d8;stroke-width:1;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><text x="360.0" y="-361.2" dominant-baseline="central" fill="#243746" font-size="21" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="21">04  ID 与 PID：6 bit 内容编号 + 2 bit 保护</tspan></text><text x="360.0" y="-331.17999999999995" dominant-baseline="central" fill="#526477" font-size="11.5" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="11.5">示例 ID = 0x01；不要把受保护的 PID 字节直接当作从节点地址。</tspan></text><text x="70.19999999999999" y="-288.5" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="70.19999999999999" dy="14.0">P1</tspan></text><text x="70.19999999999999" y="-262.6" dominant-baseline="central" fill="#243746" font-size="16.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="70.19999999999999" dy="16.0">1</tspan></text><text x="70.2" y="-230.6" dominant-baseline="central" fill="#243746" font-size="11" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="70.2" dy="11">bit 7</tspan></text><text x="153.0" y="-288.5" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="153.0" dy="14.0">P0</tspan></text><text x="153.0" y="-262.6" dominant-baseline="central" fill="#243746" font-size="16.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="153.0" dy="16.0">1</tspan></text><text x="153.0" y="-230.6" dominant-baseline="central" fill="#243746" font-size="11" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="153.0" dy="11">bit 6</tspan></text><text x="235.79999999999995" y="-288.5" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="235.79999999999995" dy="14.0">ID5</tspan></text><text x="235.79999999999995" y="-262.6" dominant-baseline="central" fill="#243746" font-size="16.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="235.79999999999995" dy="16.0">0</tspan></text><text x="235.79999999999995" y="-230.6" dominant-baseline="central" fill="#243746" font-size="11" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="235.79999999999995" dy="11">bit 5</tspan></text><text x="318.59999999999997" y="-288.5" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="318.59999999999997" dy="14.0">ID4</tspan></text><text x="318.59999999999997" y="-262.6" dominant-baseline="central" fill="#243746" font-size="16.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="318.59999999999997" dy="16.0">0</tspan></text><text x="318.59999999999997" y="-230.6" dominant-baseline="central" fill="#243746" font-size="11" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="318.59999999999997" dy="11">bit 4</tspan></text><text x="401.40000000000003" y="-288.5" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="401.40000000000003" dy="14.0">ID3</tspan></text><text x="401.40000000000003" y="-262.6" dominant-baseline="central" fill="#243746" font-size="16.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="401.40000000000003" dy="16.0">0</tspan></text><text x="401.40000000000003" y="-230.6" dominant-baseline="central" fill="#243746" font-size="11" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="401.40000000000003" dy="11">bit 3</tspan></text><text x="484.20000000000005" y="-288.5" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="484.20000000000005" dy="14.0">ID2</tspan></text><text x="484.20000000000005" y="-262.6" dominant-baseline="central" fill="#243746" font-size="16.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="484.20000000000005" dy="16.0">0</tspan></text><text x="484.20000000000005" y="-230.6" dominant-baseline="central" fill="#243746" font-size="11" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="484.20000000000005" dy="11">bit 2</tspan></text><text x="567.0" y="-288.5" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="567.0" dy="14.0">ID1</tspan></text><text x="567.0" y="-262.6" dominant-baseline="central" fill="#243746" font-size="16.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="567.0" dy="16.0">0</tspan></text><text x="567.0" y="-230.6" dominant-baseline="central" fill="#243746" font-size="11" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="567.0" dy="11">bit 1</tspan></text><text x="649.8" y="-288.5" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="649.8" dy="14.0">ID0</tspan></text><text x="649.8" y="-262.6" dominant-baseline="central" fill="#243746" font-size="16.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="649.8" dy="16.0">1</tspan></text><text x="649.8" y="-230.6" dominant-baseline="central" fill="#243746" font-size="11" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="649.8" dy="11">bit 0</tspan></text><text x="360.0" y="-207.4" dominant-baseline="central" fill="#243746" font-size="13" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="13">上图按 bit7 → bit0 书写；在线上发送时仍从 bit0 开始</tspan></text><text x="189.00000000000003" y="-160.79999999999998" dominant-baseline="central" fill="#243746" font-size="13.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="189.00000000000003" dy="13.0">P0 = ID0 ⊕ ID1 ⊕ ID2 ⊕ ID4</tspan><tspan x="189.00000000000003" dy="13.0">本例：1 ⊕ 0 ⊕ 0 ⊕ 0 = 1</tspan></text><text x="531.0000000000001" y="-160.79999999999998" dominant-baseline="central" fill="#243746" font-size="13.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="531.0000000000001" dy="13.0">P1 = NOT(ID1 ⊕ ID3 ⊕ ID4 ⊕ ID5)</tspan><tspan x="531.0000000000001" dy="13.0">本例：NOT(0) = 1（仅取 1 bit）</tspan></text><text x="360.0" y="-101.2" dominant-baseline="central" fill="#243746" font-size="13" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="13">PID = ID | (P0 &lt;&lt; 6) | (P1 &lt;&lt; 7) = 0x01 | 0x40 | 0x80 = 0xC1</tspan></text><text x="360.00000000000006" y="-40.44000000000001" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.00000000000006" dy="12.0">诊断请求：ID 0x3C → PID 0x3C；诊断响应：ID 0x3D → PID 0x7D。</tspan></text></svg>