nejoin:round;" /><path d="M 689.1999999999999 -162.0 L 682.1999999999999 -159.3 L 682.1999999999999 -164.7 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><text x="360.0" y="-361.2" dominant-baseline="central" fill="#243746" font-size="21" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="21">06  调度表：谁发数据由帧定义，何时发由主节点安排</tspan></text><text x="360.0" y="-331.17999999999995" dominant-baseline="central" fill="#526477" font-size="11.5" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="11.5">教学网络：19.2 kbit/s；4 个 10 ms 时隙组成 40 ms 循环。</tspan></text><text x="28.8" y="-304.40000000000003" dominant-baseline="central" fill="#243746" font-size="11" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="28.8" dy="11">0 ms</tspan></text><text x="108.0" y="-262.5" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="108.0" dy="12.0">A_Status</tspan><tspan x="108.0" dy="12.0">ID 0x01 / PID 0xC1</tspan><tspan x="108.0" dy="12.0">2 字节数据</tspan></text><text x="108.0" y="-192.49999999999997" dominant-baseline="central" fill="#243746" font-size="10.7" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="108.0" dy="10.7">从 A 发布 → 主 / B 订阅</tspan></text><text x="194.39999999999998" y="-304.40000000000003" dominant-baseline="central" fill="#243746" font-size="11" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="194.39999999999998" dy="11">10 ms</tspan></text><text x="273.59999999999997" y="-262.5" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="273.59999999999997" dy="12.0">B_Command</tspan><tspan x="273.59999999999997" dy="12.0">ID 0x02 / PID 0x42</tspan><tspan x="273.59999999999997" dy="12.0">2 字节数据</tspan></text><text x="273.59999999999997" y="-192.49999999999997" dominant-baseline="central" fill="#243746" font-size="10.7" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="273.59999999999997" dy="10.7">主发布 → 从 B 订阅</tspan></text><text x="360.0" y="-304.40000000000003" dominant-baseline="central" fill="#243746" font-size="11" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="11">20 ms</tspan></text><text x="439.2" y="-262.5" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="439.2" dy="12.0">A_Status</tspan><tspan x="439.2" dy="12.0">ID 0x01 / PID 0xC1</tspan><tspan x="439.2" dy="12.0">2 字节数据</tspan></text><text x="439.2" y="-192.49999999999997" dominant-baseline="central" fill="#243746" font-size="10.7" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="439.2" dy="10.7">从 A 发布 → 主 / B 订阅</tspan></text><text x="525.6" y="-304.40000000000003" dominant-baseline="central" fill="#243746" font-size="11" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="525.6" dy="11">30 ms</tspan></text><text x="604.8000000000001" y="-262.5" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="604.8000000000001" dy="12.0">B_Status</tspan><tspan x="604.8000000000001" dy="12.0">ID 0x03 / PID 0x03</tspan><tspan x="604.8000000000001" dy="12.0">2 字节数据</tspan></text><text x="604.8000000000001" y="-192.49999999999997" dominant-baseline="central" fill="#243746" font-size="10.7" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="604.8000000000001" dy="10.7">从 B 发布 → 主订阅</tspan></text><text x="691.1999999999999" y="-304.40000000000003" dominant-baseline="central" fill="#243746" font-size="11" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="691.1999999999999" dy="11">40 ms</tspan></text><text x="360.0" y="-158.79999999999998" dominant-baseline="central" fill="#243746" font-size="13" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="13">40 ms 后从第一项重新循环；每个时隙的 Header 都由主任务发送</tspan></text><text x="189.00000000000003" y="-120.89999999999998" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="189.00000000000003" dy="14.0">A_Status：每循环出现两次</tspan><tspan x="189.00000000000003" dy="14.0">更新周期 = 20 ms</tspan></text><text x="531.0000000000001" y="-120.89999999999998" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="531.0000000000001" dy="14.0">B_Command / B_Status：各一次</tspan><tspan x="531.0000000000001" dy="14.0">更新周期 = 40 ms</tspan></text><text x="360.00000000000006" y="-40.44000000000001" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.00000000000006" dy="12.0">每个时隙还要容纳响应、间隔和时序裕量；帧传输耗时不等于业务端到端延迟。</tspan></text></svg>