,-136.79999999999998" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 554.4,-232.20000000000002 L 554.4,-217.79999999999998" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 554.4 -210.79999999999998 L 551.6999999999999 -217.79999999999998 L 557.1 -217.79999999999998 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 633.6,-208.79999999999998 L 633.6,-223.20000000000002" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 633.6 -230.20000000000002 L 636.3000000000001 -223.20000000000002 L 630.9 -223.20000000000002 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 594.0,-174.6 L 594.0,-136.79999999999998" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 28.8,-136.79999999999998 L 691.1999999999999,-136.79999999999998" style="stroke:#386bb0;fill:none;stroke-width:3;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><text x="360.0" y="-361.2" dominant-baseline="central" fill="#243746" font-size="21" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="21">01  LIN 网络：MCU、收发器和单根总线</tspan></text><text x="360.0" y="-331.17999999999995" dominant-baseline="central" fill="#526477" font-size="11.5" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="11.5">这是功能示意图；实际引脚、终端网络和电压范围按原理图及数据手册确认。</tspan></text><text x="126.0" y="-307.59999999999997" dominant-baseline="central" fill="#243746" font-size="16" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="126.0" dy="16">主节点</tspan></text><text x="126.0" y="-275.70000000000005" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="126.0" dy="14.0">MCU</tspan><tspan x="126.0" dy="14.0">主任务 + 从任务</tspan></text><text x="126.0" y="-230.32" dominant-baseline="central" fill="#243746" font-size="10" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="126.0" dy="10">TXD       RXD</tspan></text><text x="126.0" y="-205.7" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="126.0" dy="14.0">LIN 收发器</tspan></text><text x="360.0" y="-307.59999999999997" dominant-baseline="central" fill="#243746" font-size="16" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="16">从节点 A</tspan></text><text x="360.0" y="-275.70000000000005" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="14.0">MCU</tspan><tspan x="360.0" dy="14.0">从任务</tspan></text><text x="360.0" y="-230.32" dominant-baseline="central" fill="#243746" font-size="10" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="10">TXD       RXD</tspan></text><text x="360.0" y="-205.7" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="14.0">LIN 收发器</tspan></text><text x="594.0" y="-307.59999999999997" dominant-baseline="central" fill="#243746" font-size="16" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="594.0" dy="16">从节点 B</tspan></text><text x="594.0" y="-275.70000000000005" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="594.0" dy="14.0">MCU</tspan><tspan x="594.0" dy="14.0">从任务</tspan></text><text x="594.0" y="-230.32" dominant-baseline="central" fill="#243746" font-size="10" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="594.0" dy="10">TXD       RXD</tspan></text><text x="594.0" y="-205.7" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="594.0" dy="14.0">LIN 收发器</tspan></text><text x="360.0" y="-132.6" dominant-baseline="central" fill="#243746" font-size="12" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="12">LIN 单线信号 + 节点间地参考；无条件帧的响应只有一个发布者</tspan></text><text x="187.20000000000005" y="-99.60000000000001" dominant-baseline="central" fill="#243746" font-size="13.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="187.20000000000005" dy="13.0">显性 0：任一节点拉低 → 总线为低</tspan><tspan x="187.20000000000005" dy="13.0">隐性 1：所有节点释放 → 上拉为高</tspan></text><text x="532.8000000000001" y="-99.60000000000001" dominant-baseline="central" fill="#243746" font-size="13.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="532.8000000000001" dy="13.0">MCU 侧：3.3 V / 5 V 逻辑域（视芯片）</tspan><tspan x="532.8000000000001" dy="13.0">总线侧：VBAT 域；不能直连 MCU 引脚</tspan></text><text x="360.00000000000006" y="-40.44000000000001" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.00000000000006" dy="12.0">主节点通常有较强的上拉终端网络；不是照搬 CAN 两端 120 Ω 终端。</tspan></text></svg>