stroke-width:1.4;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 342.0 -12.8 L 339.3 -19.8 L 344.7 -19.8 Z" style="stroke:#2563a6;fill:#2563a6;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 288.0,12.6 L 261.0,12.600000000000001" style="stroke:#2563a6;fill:none;stroke-width:1.4;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 254.0 12.6 L 261.0 9.9 L 261.0 15.3 Z" style="stroke:#2563a6;fill:#2563a6;stroke-linecap:butt;stroke-linejoin:miter;" /><text x="198.0" y="-171.79999999999998" dominant-baseline="central" fill="#25374b" font-size="17" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="198.0" dy="17">队列复制指针值，不会延长局部数组的生命周期</tspan></text><text x="54.0" y="-111.14999999999999" dominant-baseline="central" fill="#25374b" font-size="10.5" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="54.0" dy="10.5">生产者函数局部buf</tspan><tspan x="54.0" dy="10.5">在当前栈帧里</tspan></text><text x="198.0" y="-114.89999999999999" dominant-baseline="central" fill="#25374b" font-size="13.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="198.0" dy="13.0">把buf地址入队</tspan><tspan x="198.0" dy="13.0">只复制地址数值</tspan></text><text x="342.0" y="-111.14999999999999" dominant-baseline="central" fill="#25374b" font-size="10.5" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="342.0" dy="10.5">函数返回/继续运行</tspan><tspan x="342.0" dy="10.5">buf失效或被改写</tspan></text><text x="342.0" y="0.6000000000000014" dominant-baseline="central" fill="#25374b" font-size="8.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="342.0" dy="8.0">消费者出队指针</tspan><tspan x="342.0" dy="8.0">地址相同，内容不再可靠</tspan></text><text x="198.0" y="-0.8999999999999986" dominant-baseline="central" fill="#25374b" font-size="9.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="198.0" dy="9.0">改用消息副本</tspan><tspan x="198.0" dy="9.0">或显式缓冲所有权协议</tspan></text></svg>