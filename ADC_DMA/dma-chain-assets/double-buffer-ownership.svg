498.6" dy="12.0">描述符 B</tspan><tspan x="498.6" dy="12.0">源：缓冲区 B</tspan></text><text x="360.0" y="-324.2" dominant-baseline="central" fill="#243746" font-size="11" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="11">next → B</tspan></text><text x="360.0" y="-273.8" dominant-baseline="central" fill="#243746" font-size="11" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="11">next → A</tspan></text><text x="158.4" y="-245.20000000000002" dominant-baseline="central" fill="#243746" font-size="13" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="158.4" dy="13">阶段 1：首次读 A</tspan></text><text x="370.8" y="-245.20000000000002" dominant-baseline="central" fill="#243746" font-size="13" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="370.8" dy="13">阶段 2：切换读 B</tspan></text><text x="583.1999999999999" y="-245.20000000000002" dominant-baseline="central" fill="#243746" font-size="13" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="583.1999999999999" dy="13">阶段 3：回到 A</tspan></text><text x="28.8" y="-193.79999999999998" dominant-baseline="central" fill="#243746" font-size="12" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="28.8" dy="12">A 块</tspan></text><text x="28.8" y="-141.6" dominant-baseline="central" fill="#243746" font-size="12" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="28.8" dy="12">B 块</tspan></text><text x="158.4" y="-199.8" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="158.4" dy="12.0">DMA 读取 A</tspan><tspan x="158.4" dy="12.0">CPU 不得改写</tspan></text><text x="158.4" y="-147.6" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="158.4" dy="12.0">B 已预填</tspan><tspan x="158.4" dy="12.0">可在切换前更新</tspan></text><text x="370.8" y="-199.8" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="370.8" dy="12.0">CPU 更新 A</tspan><tspan x="370.8" dy="12.0">须在回到 A 前完成</tspan></text><text x="370.8" y="-147.6" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="370.8" dy="12.0">DMA 读取 B</tspan><tspan x="370.8" dy="12.0">CPU 不得改写</tspan></text><text x="583.2" y="-199.8" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="583.2" dy="12.0">DMA 读取 A</tspan><tspan x="583.2" dy="12.0">使用新一轮数据</tspan></text><text x="583.2" y="-147.6" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="583.2" dy="12.0">CPU 更新 B</tspan><tspan x="583.2" dy="12.0">须在回到 B 前完成</tspan></text><text x="360.0" y="-90.4" dominant-baseline="central" fill="#243746" font-size="13" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="13">假设每段 256 个半字、消耗率 16000 半字/秒：理论窗口 16 ms</tspan></text><text x="360.0" y="-60.59999999999999" dominant-baseline="central" fill="#243746" font-size="12" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="12">CPU 准备 + 调度 + 必要缓存维护，必须在该窗口内完成并留余量。</tspan></text><text x="360.0" y="-35.40000000000001" dominant-baseline="central" fill="#243746" font-size="12" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="12">接收 RX 方向反过来：DMA 写当前块，CPU 读已完成块；须赶在覆盖前读完。</tspan></text></svg>