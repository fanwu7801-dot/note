stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 250.0 -170.28000000000003 L 243.0 -167.58000000000004 L 243.0 -172.98000000000002 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 336.59999999999997,-244.79999999999998 L 336.59999999999997,-208.79999999999998" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 336.59999999999997 -201.79999999999998 L 333.9 -208.79999999999998 L 339.29999999999995 -208.79999999999998 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 421.2,-170.28000000000003 L 495.0,-170.28000000000003" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 502.0 -170.28000000000003 L 495.0 -167.58000000000004 L 495.0 -172.98000000000002 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><path d="M 336.59999999999997,-140.4 L 336.59999999999997,-99.0" style="stroke:#243746;fill:none;stroke-width:1.5;stroke-dasharray:-;stroke-linecap:round;stroke-linejoin:round;" /><path d="M 336.59999999999997 -92.0 L 333.9 -99.0 L 339.29999999999995 -99.0 Z" style="stroke:#243746;fill:#243746;stroke-linecap:butt;stroke-linejoin:miter;" /><text x="360.0" y="-363.8" dominant-baseline="central" fill="#243746" font-size="20" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="20">链表决定搬什么，请求推动什么时候搬</tspan></text><text x="108.0" y="-294.90000000000003" dominant-baseline="central" fill="#243746" font-size="13.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="108.0" dy="13.0">当前描述符</tspan><tspan x="108.0" dy="13.0">源 / 目的 / 数量 / next</tspan></text><text x="336.59999999999997" y="-294.90000000000003" dominant-baseline="central" fill="#243746" font-size="13.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="336.59999999999997" dy="13.0">当前段参数</tspan><tspan x="336.59999999999997" dy="13.0">地址、宽度和剩余数量</tspan></text><text x="221.4" y="-305.40000000000003" dominant-baseline="central" fill="#243746" font-size="12" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="221.4" dy="12">装载</tspan></text><text x="108.0" y="-189.6" dominant-baseline="central" fill="#243746" font-size="13.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="108.0" dy="13.0">外设 FIFO / 数据就绪</tspan><tspan x="108.0" dy="13.0">产生 DMA 请求</tspan></text><text x="336.59999999999997" y="-189.6" dominant-baseline="central" fill="#243746" font-size="13.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="336.59999999999997" dy="13.0">DMA 按参数搬运</tspan><tspan x="336.59999999999997" dy="13.0">请求粒度由配置决定</tspan></text><text x="599.4" y="-189.6" dominant-baseline="central" fill="#243746" font-size="13.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="599.4" dy="13.0">数据到达目的地址</tspan><tspan x="599.4" dy="13.0">本例：外设数据寄存器</tspan></text><text x="221.4" y="-201.0" dominant-baseline="central" fill="#243746" font-size="12" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="221.4" dy="12">请求</tspan></text><text x="462.59999999999997" y="-201.0" dominant-baseline="central" fill="#243746" font-size="12" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="462.59999999999997" dy="12">数据</tspan></text><text x="336.59999999999997" y="-81.2" dominant-baseline="central" fill="#243746" font-size="11.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="336.59999999999997" dy="11.0">段完成且有下一节点 → 硬件准备下一段</tspan></text><text x="360.0" y="-37.199999999999974" dominant-baseline="central" fill="#243746" font-size="12" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="12">没有有效请求，链表正确也可能不搬；预取和装载时机以手册为准。</tspan></text></svg>