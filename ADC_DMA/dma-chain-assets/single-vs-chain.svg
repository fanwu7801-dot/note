ly="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="14">普通单次 DMA：段间由 CPU 重新配置</tspan></text><text x="86.39999999999999" y="-253.2" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="86.39999999999999" dy="14.0">CPU</tspan><tspan x="86.39999999999999" dy="14.0">配置 A</tspan></text><text x="252.00000000000003" y="-253.2" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="252.00000000000003" dy="14.0">DMA</tspan><tspan x="252.00000000000003" dy="14.0">搬运 A</tspan></text><text x="424.8" y="-253.2" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="424.8" dy="14.0">CPU</tspan><tspan x="424.8" dy="14.0">配置 B</tspan></text><text x="603.0" y="-253.2" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="603.0" dy="14.0">DMA</tspan><tspan x="603.0" dy="14.0">搬运 B</tspan></text><text x="360.0" y="-188.6" dominant-baseline="central" fill="#243746" font-size="14" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="14">硬件链式 DMA：CPU 提前准备，DMA 自动接力</tspan></text><text x="97.2" y="-141.6" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="97.2" dy="14.0">CPU 准备</tspan><tspan x="97.2" dy="14.0">A → B 的链</tspan></text><text x="273.59999999999997" y="-141.6" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="273.59999999999997" dy="14.0">DMA</tspan><tspan x="273.59999999999997" dy="14.0">搬运 A</tspan></text><text x="442.8" y="-141.6" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="442.8" dy="14.0">DMA 硬件</tspan><tspan x="442.8" dy="14.0">装载 B 参数</tspan></text><text x="622.8000000000001" y="-141.6" dominant-baseline="central" fill="#243746" font-size="14.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="622.8000000000001" dy="14.0">DMA</tspan><tspan x="622.8000000000001" dy="14.0">搬运 B</tspan></text><text x="360.0" y="-71.6" dominant-baseline="central" fill="#243746" font-size="14" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="14">两种方式的一段内部，都由 DMA 搬数据</tspan></text><text x="360.0" y="-39.0" dominant-baseline="central" fill="#243746" font-size="12" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="12">箭头表示顺序，框宽不代表耗时；链式能力与更新字段以手册为准</tspan></text></svg>