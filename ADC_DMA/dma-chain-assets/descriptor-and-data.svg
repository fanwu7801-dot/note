fill="#243746" font-size="20" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="20">描述符是搬运单，缓冲区是数据</tspan></text><text x="106.2" y="-315.00000000000006" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="106.2" dy="12.0">描述符 A</tspan><tspan x="106.2" dy="12.0">src：缓冲区 A</tspan><tspan x="106.2" dy="12.0">dst：同一外设寄存器</tspan><tspan x="106.2" dy="12.0">count：256 个半字</tspan><tspan x="106.2" dy="12.0">next：B</tspan></text><text x="106.2" y="-192.1" dominant-baseline="central" fill="#243746" font-size="13.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="106.2" dy="13.0">缓冲区 A：512 字节</tspan></text><text x="311.40000000000003" y="-315.00000000000006" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="311.40000000000003" dy="12.0">描述符 B</tspan><tspan x="311.40000000000003" dy="12.0">src：缓冲区 B</tspan><tspan x="311.40000000000003" dy="12.0">dst：同一外设寄存器</tspan><tspan x="311.40000000000003" dy="12.0">count：256 个半字</tspan><tspan x="311.40000000000003" dy="12.0">next：C</tspan></text><text x="311.40000000000003" y="-192.1" dominant-baseline="central" fill="#243746" font-size="13.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="311.40000000000003" dy="13.0">缓冲区 B：512 字节</tspan></text><text x="516.6" y="-315.00000000000006" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="516.6" dy="12.0">描述符 C</tspan><tspan x="516.6" dy="12.0">src：缓冲区 C</tspan><tspan x="516.6" dy="12.0">dst：同一外设寄存器</tspan><tspan x="516.6" dy="12.0">count：256 个半字</tspan><tspan x="516.6" dy="12.0">next：结束</tspan></text><text x="516.6" y="-192.1" dominant-baseline="central" fill="#243746" font-size="13.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="516.6" dy="13.0">缓冲区 C：512 字节</tspan></text><text x="669.6" y="-290.00000000000006" dominant-baseline="central" fill="#243746" font-size="11.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="669.6" dy="11.0">链结束</tspan></text><text x="626.4" y="-228.0" dominant-baseline="central" fill="#243746" font-size="12" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="626.4" dy="12">虚线：地址引用</tspan></text><text x="311.40000000000003" y="-97.4" dominant-baseline="central" fill="#243746" font-size="11.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="311.40000000000003" dy="11.0">DMA：按 A / B / C 顺序搬运</tspan></text><text x="561.6" y="-98.4" dominant-baseline="central" fill="#243746" font-size="12.0" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="561.6" dy="12.0">固定目的：外设数据寄存器</tspan></text><text x="430.2" y="-131.88" dominant-baseline="central" fill="#243746" font-size="12" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="430.2" dy="12">数据</tspan></text><text x="360.0" y="-42.59999999999999" dominant-baseline="central" fill="#243746" font-size="12" font-family="Microsoft YaHei" text-anchor="middle"><tspan x="360.0" dy="12">next 指向描述符；src 指向数据。三路源按段使用，不是同时搬运。</tspan></text></svg>